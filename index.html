<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTasks — 自分のタスク</title>
<style>
  :root{
    --primary:#1f5b8c; --primary-hover:#16446b; --accent:#538bb0;
    --bg:#f4f6f9; --panel:#ffffff; --panel-2:#f8fafc;
    --text:#1e293b; --sub:#64748b; --border:#e2e8f0;
    --danger:#ef4444; --warn:#d97706; --ok:#16a34a;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
    --radius:12px;
  }
  html[data-theme="dark"]{
    --primary:#5b9bd0; --primary-hover:#7db2de; --accent:#8ec2e4;
    --bg:#0f172a; --panel:#1a2436; --panel-2:#141d2e;
    --text:#e6edf5; --sub:#94a3b8; --border:#2a3852;
    --danger:#f87171; --warn:#fbbf24; --ok:#4ade80;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,-apple-system,sans-serif;
    font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px 96px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:.02em}
  h1 .dot{color:var(--accent)}
  .today-label{color:var(--sub);font-size:.85rem}
  .spacer{flex:1}
  .iconbtn{
    background:transparent;border:1px solid var(--border);color:var(--sub);
    width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;transition:.15s;
  }
  .iconbtn:hover{border-color:var(--primary);color:var(--primary)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
  .stat .n{font-size:1.4rem;font-weight:700;line-height:1.2}
  .stat .l{font-size:.72rem;color:var(--sub)}
  .stat.danger .n{color:var(--danger)}
  .stat.ok .n{color:var(--ok)}

  form.add{display:flex;gap:8px;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:8px;box-shadow:var(--shadow)}
  form.add:focus-within{border-color:var(--primary)}
  form.add input{flex:1;border:0;background:transparent;color:var(--text);font-size:1rem;
    padding:8px 10px;outline:none;font-family:inherit}
  form.add button{background:var(--primary);color:#fff;border:0;border-radius:9px;
    padding:0 18px;font-weight:600;cursor:pointer;font-size:.9rem;font-family:inherit}
  form.add button:hover{background:var(--primary-hover)}
  .hint{font-size:.72rem;color:var(--sub);margin:6px 2px 0;display:flex;gap:6px;flex-wrap:wrap}
  .hint code{background:var(--panel-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px}

  .bar{display:flex;gap:8px;align-items:center;margin:20px 0 10px;flex-wrap:wrap}
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:3px}
  .tabs button{border:0;background:transparent;color:var(--sub);padding:6px 13px;border-radius:7px;
    cursor:pointer;font-size:.85rem;font-weight:600;font-family:inherit}
  .tabs button.on{background:var(--primary);color:#fff}
  .search{flex:1;min-width:140px}
  .search input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:8px 12px;color:var(--text);font-size:.88rem;outline:none;font-family:inherit}
  .search input:focus{border-color:var(--primary)}

  .projects{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .pchip{border:1px solid var(--border);background:var(--panel);color:var(--sub);
    border-radius:999px;padding:3px 11px;font-size:.78rem;cursor:pointer;font-family:inherit}
  .pchip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .group-title{font-size:.75rem;font-weight:700;color:var(--sub);letter-spacing:.06em;
    margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
  .group-title.overdue{color:var(--danger)}
  .group-title .cnt{font-weight:500;opacity:.7}

  .task{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden}
  .task.done{opacity:.55}
  .row{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;cursor:pointer}
  .check{flex:none;width:20px;height:20px;margin-top:2px;border:2px solid var(--border);
    border-radius:6px;background:transparent;cursor:pointer;position:relative;transition:.15s;padding:0}
  .check:hover{border-color:var(--primary)}
  .task.done .check{background:var(--ok);border-color:var(--ok)}
  .task.done .check::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .body{flex:1;min-width:0}
  .title{font-size:.97rem;word-break:break-word}
  .task.done .title{text-decoration:line-through}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
  .tag{font-size:.72rem;border-radius:6px;padding:1px 7px;border:1px solid var(--border);color:var(--sub)}
  .tag.proj{color:var(--accent);border-color:var(--accent)}
  .tag.due.over{color:var(--danger);border-color:var(--danger);font-weight:600}
  .tag.due.today{color:var(--warn);border-color:var(--warn);font-weight:600}
  .tag.pri-urgent{color:#fff;background:var(--danger);border-color:var(--danger);font-weight:700}
  .tag.pri-high{color:var(--danger);border-color:var(--danger)}
  .tag.pri-low{opacity:.6}
  .note-preview{font-size:.78rem;color:var(--sub);margin-top:4px;white-space:pre-wrap;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .editor{border-top:1px dashed var(--border);padding:12px 13px;background:var(--panel-2);display:none}
  .task.open .editor{display:block}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fields label{font-size:.72rem;color:var(--sub);display:block;margin-bottom:3px}
  .fields .full{grid-column:1/-1}
  .editor input,.editor select,.editor textarea{
    width:100%;background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:7px 9px;color:var(--text);font-size:.88rem;font-family:inherit;outline:none}
  .editor input:focus,.editor select:focus,.editor textarea:focus{border-color:var(--primary)}
  .editor textarea{resize:vertical;min-height:60px}
  .ebar{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .ebar .del{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--danger);
    border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.8rem;font-family:inherit}
  .ebar .del:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
  .quick{background:var(--panel);border:1px solid var(--border);color:var(--sub);
    border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.78rem;font-family:inherit}
  .quick:hover{border-color:var(--primary);color:var(--primary)}

  .empty{text-align:center;padding:56px 20px;color:var(--sub)}
  .empty .big{font-size:2.4rem;margin-bottom:8px}
  .empty p{margin:6px 0}
  .empty button{margin-top:14px;background:transparent;border:1px solid var(--primary);color:var(--primary);
    border-radius:9px;padding:8px 16px;cursor:pointer;font-size:.85rem;font-weight:600;font-family:inherit}
  .empty button:hover{background:var(--primary);color:#fff}

  .tools{display:flex;gap:8px;justify-content:center;margin-top:32px;flex-wrap:wrap}
  .tools button{background:transparent;border:1px solid var(--border);color:var(--sub);
    border-radius:8px;padding:6px 13px;cursor:pointer;font-size:.78rem;font-family:inherit}
  .tools button:hover{border-color:var(--primary);color:var(--primary)}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(160%);
    background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;
    display:flex;gap:14px;align-items:center;font-size:.85rem;box-shadow:var(--shadow);
    transition:transform .22s ease;z-index:50;max-width:90vw}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast button{background:transparent;border:0;color:var(--accent);font-weight:700;cursor:pointer;
    font-size:.85rem;font-family:inherit;white-space:nowrap}

  @media(max-width:560px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .fields{grid-template-columns:1fr}
    .wrap{padding:16px 12px 80px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MyTasks<span class="dot">.</span></h1>
    <span class="today-label" id="todayLabel"></span>
    <span class="spacer"></span>
    <button class="iconbtn" id="themeBtn" title="ライト / ダーク切替">◐</button>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="sOpen">0</div><div class="l">未完了</div></div>
    <div class="stat"><div class="n" id="sToday">0</div><div class="l">今日やる</div></div>
    <div class="stat danger"><div class="n" id="sOver">0</div><div class="l">期限切れ</div></div>
    <div class="stat ok"><div class="n" id="sDone">0</div><div class="l">今週完了</div></div>
  </div>

  <form class="add" id="addForm" autocomplete="off">
    <input id="addInput" placeholder="タスクを入力   例: 請求書を送る #経理 @明日 !">
    <button type="submit">追加</button>
  </form>
  <div class="hint">
    <code>#プロジェクト</code>
    <code>@今日 / @明日 / @金 / @8/31 / @+3</code>
    <code>! 高</code>
    <code>!! 最優先</code>
    <code>*毎日 / *毎週 / *毎月</code>
  </div>

  <div class="bar">
    <div class="tabs" id="tabs">
      <button data-view="today" class="on">今日</button>
      <button data-view="week">今週</button>
      <button data-view="all">すべて</button>
      <button data-view="done">完了</button>
    </div>
    <div class="search"><input id="q" placeholder="検索…  ( / でフォーカス )"></div>
  </div>
  <div class="projects" id="projects"></div>

  <main id="list"></main>

  <div class="tools">
    <button id="expBtn">JSON書き出し</button>
    <button id="impBtn">JSON読み込み</button>
    <button id="mdBtn">Markdownでコピー</button>
    <button id="clearDone">古い完了を整理</button>
    <input type="file" id="impFile" accept="application/json" style="display:none">
  </div>
</div>

<div id="toast"><span id="toastMsg"></span><button id="toastAct" style="display:none"></button></div>

<script>
(function(){
  "use strict";
  var KEY = "mytasks.v1", TKEY = "mytasks.theme";
  var PRI = {urgent:0, high:1, normal:2, low:3};
  var PRI_LABEL = {urgent:"最優先", high:"高", normal:"", low:"低"};
  var PRI_FULL = {urgent:"最優先", high:"高", normal:"通常", low:"低"};
  var REP_LABEL = {none:"", daily:"毎日", weekly:"毎週", monthly:"毎月"};
  var REP_FULL = {none:"なし", daily:"毎日", weekly:"毎週", monthly:"毎月"};
  var WD = ["日","月","火","水","木","金","土"];

  /* ---------- storage ---------- */
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return [];
      var d = JSON.parse(raw);
      return Array.isArray(d) ? d : (d.tasks || []);
    }catch(e){ return []; }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(tasks)); }
    catch(e){ toast("保存できませんでした（ブラウザの設定を確認してください）"); }
  }
  var tasks = load();
  var view = "today", query = "", projFilter = "", openId = null, undoBuf = null, toastTimer = null;

  /* ---------- dates ---------- */
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function today(){ var n = new Date(); n.setHours(0,0,0,0); return n; }
  function addDays(d,n){ var x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
  function addMonths(d,n){ var x = new Date(d.getTime()); x.setMonth(x.getMonth()+n); return x; }
  function fromISO(s){ var p = String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function diffDays(s){ return Math.round((fromISO(s) - today()) / 86400000); }
  function dueLabel(s){
    var n = diffDays(s), d = fromISO(s);
    if(n === 0) return "今日";
    if(n === 1) return "明日";
    if(n === -1) return "昨日";
    if(n < 0) return (d.getMonth()+1) + "/" + d.getDate() + " (" + (-n) + "日超過)";
    if(n < 7) return (d.getMonth()+1) + "/" + d.getDate() + "(" + WD[d.getDay()] + ")";
    return (d.getMonth()+1) + "/" + d.getDate();
  }

  function parseDate(tok){
    var t = today(), m;
    var map = {"今日":0,"きょう":0,"本日":0,"明日":1,"あした":1,"あす":1,"明後日":2,"あさって":2,"昨日":-1};
    if(Object.prototype.hasOwnProperty.call(map, tok)) return iso(addDays(t, map[tok]));
    if(tok === "来週") return iso(addDays(t, 7));
    if(tok === "週末" || tok === "今週末"){ var g = (6 - t.getDay() + 7) % 7; return iso(addDays(t, g || 7)); }
    if((m = tok.match(/^\+(\d+)$/))) return iso(addDays(t, +m[1]));
    if((m = tok.match(/^([月火水木金土日])(曜日?)?$/))){
      var w = WD.indexOf(m[1]), g2 = (w - t.getDay() + 7) % 7;
      return iso(addDays(t, g2 === 0 ? 7 : g2));
    }
    if((m = tok.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return iso(new Date(+m[1], +m[2]-1, +m[3]));
    if((m = tok.match(/^(\d{1,2})[\/月](\d{1,2})日?$/))){
      var y = t.getFullYear(), c = new Date(y, +m[1]-1, +m[2]);
      if(c < t) c = new Date(y+1, +m[1]-1, +m[2]);
      return iso(c);
    }
    return null;
  }

  /* ---------- quick-add parsing ---------- */
  var REP_MAP = {"毎日":"daily","毎週":"weekly","毎月":"monthly","daily":"daily","weekly":"weekly","monthly":"monthly"};
  function parseInput(raw){
    var o = {title:" " + raw.trim() + " ", project:"", due:"", priority:"normal", repeat:"none"};
    o.title = o.title.replace(/\s#([^\s#]+)/g, function(_, p){ o.project = p; return " "; });
    o.title = o.title.replace(/\s@(\S+)/g, function(m, d){
      var v = parseDate(d);
      if(v){ o.due = v; return " "; }
      return m;
    });
    o.title = o.title.replace(/\s\*(毎日|毎週|毎月|daily|weekly|monthly)(?=\s)/g, function(_, r){
      o.repeat = REP_MAP[r]; return " ";
    });
    o.title = o.title.replace(/\s(!{1,2})(?=\s)/g, function(_, e){
      o.priority = (e === "!!") ? "urgent" : "high"; return " ";
    });
    o.title = o.title.replace(/\s+/g, " ").trim();
    return o;
  }

  /* ---------- crud ---------- */
  function uid(){ return Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
  function newTask(f){
    return {id:uid(), title:f.title, note:f.note || "", project:f.project || "", due:f.due || "",
            priority:f.priority || "normal", repeat:f.repeat || "none",
            done:false, doneAt:"", createdAt:new Date().toISOString()};
  }
  function addTask(raw){
    var p = parseInput(raw);
    if(!p.title) return null;
    var t = newTask(p);
    tasks.push(t); save();
    return t;
  }
  function find(id){
    for(var i = 0; i < tasks.length; i++) if(tasks[i].id === id) return tasks[i];
    return null;
  }
  function nextDue(t){
    var base = t.due ? fromISO(t.due) : today();
    if(base < today()) base = today();
    if(t.repeat === "daily") return iso(addDays(base, 1));
    if(t.repeat === "weekly") return iso(addDays(base, 7));
    if(t.repeat === "monthly") return iso(addMonths(base, 1));
    return "";
  }
  function toggle(id){
    var t = find(id);
    if(!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? new Date().toISOString() : "";
    if(t.done && t.repeat && t.repeat !== "none"){
      var nd = nextDue(t);
      tasks.push(newTask({title:t.title, note:t.note, project:t.project, due:nd,
                          priority:t.priority, repeat:t.repeat}));
      toast("繰り返しタスクを " + dueLabel(nd) + " に再作成しました");
    }
    save(); render();
  }
  function trimText(s, n){ return s.length > n ? s.slice(0, n) + "…" : s; }
  function remove(id){
    var idx = -1;
    for(var i = 0; i < tasks.length; i++) if(tasks[i].id === id){ idx = i; break; }
    if(idx < 0) return;
    undoBuf = {task:tasks[idx], index:idx};
    tasks.splice(idx, 1);
    if(openId === id) openId = null;
    save(); render();
    toast("「" + trimText(undoBuf.task.title, 18) + "」を削除しました", "元に戻す", function(){
      if(!undoBuf) return;
      tasks.splice(Math.min(undoBuf.index, tasks.length), 0, undoBuf.task);
      undoBuf = null; save(); render();
    });
  }

  /* ---------- filter & sort ---------- */
  function visible(){
    var q = query.trim().toLowerCase();
    return tasks.filter(function(t){
      if(view === "done"){ if(!t.done) return false; }
      else if(t.done) return false;
      if(projFilter && t.project !== projFilter) return false;
      if(q && (t.title + " " + t.project + " " + t.note).toLowerCase().indexOf(q) < 0) return false;
      if(view === "today") return !!t.due && diffDays(t.due) <= 0;
      if(view === "week") return !!t.due && diffDays(t.due) <= 6;
      return true;
    });
  }
  function cmp(a, b){
    if(view === "done") return (b.doneAt || "") < (a.doneAt || "") ? -1 : 1;
    var ad = a.due || "9999-99-99", bd = b.due || "9999-99-99";
    if(ad !== bd) return ad < bd ? -1 : 1;
    if(PRI[a.priority] !== PRI[b.priority]) return PRI[a.priority] - PRI[b.priority];
    return a.createdAt < b.createdAt ? -1 : 1;
  }
  function bucket(t){
    if(view === "done") return "完了済み";
    if(!t.due) return "期限なし";
    var n = diffDays(t.due);
    if(n < 0) return "期限切れ";
    if(n === 0) return "今日";
    if(n === 1) return "明日";
    if(n <= 6) return "今週";
    return "これから";
  }
  var ORDER = ["期限切れ","今日","明日","今週","これから","期限なし","完了済み"];

  /* ---------- render ---------- */
  var ESC = {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"};
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ESC[c]; }); }

  function renderStats(){
    var open = 0, tod = 0, over = 0, dn = 0, w7 = iso(addDays(today(), -6));
    tasks.forEach(function(t){
      if(t.done){
        if(t.doneAt && t.doneAt.slice(0,10) >= w7) dn++;
        return;
      }
      open++;
      if(t.due){
        var n = diffDays(t.due);
        if(n < 0) over++; else if(n === 0) tod++;
      }
    });
    document.getElementById("sOpen").textContent = open;
    document.getElementById("sToday").textContent = tod;
    document.getElementById("sOver").textContent = over;
    document.getElementById("sDone").textContent = dn;
  }

  function renderProjects(){
    var seen = {}, order = [];
    tasks.forEach(function(t){
      if(t.project && !seen[t.project]){ seen[t.project] = 1; order.push(t.project); }
    });
    var el = document.getElementById("projects");
    if(!order.length){ el.innerHTML = ""; return; }
    var html = '<button class="pchip' + (projFilter ? "" : " on") + '" data-p="">すべて</button>';
    html += order.map(function(p){
      var n = tasks.filter(function(t){ return t.project === p && !t.done; }).length;
      return '<button class="pchip' + (projFilter === p ? " on" : "") + '" data-p="' + esc(p) + '">#' + esc(p) + ' ' + n + '</button>';
    }).join("");
    el.innerHTML = html;
  }

  function taskHTML(t){
    var tags = [];
    if(t.project) tags.push('<span class="tag proj">#' + esc(t.project) + '</span>');
    if(t.due){
      var n = diffDays(t.due);
      var cls = n < 0 ? "over" : (n === 0 ? "today" : "");
      tags.push('<span class="tag due ' + cls + '">' + esc(dueLabel(t.due)) + '</span>');
    }
    if(t.priority !== "normal") tags.push('<span class="tag pri-' + t.priority + '">' + PRI_LABEL[t.priority] + '</span>');
    if(t.repeat && t.repeat !== "none") tags.push('<span class="tag">↻ ' + REP_LABEL[t.repeat] + '</span>');

    var priOpts = ["urgent","high","normal","low"].map(function(p){
      return '<option value="' + p + '"' + (t.priority === p ? " selected" : "") + '>' + PRI_FULL[p] + '</option>';
    }).join("");
    var repOpts = ["none","daily","weekly","monthly"].map(function(r){
      return '<option value="' + r + '"' + ((t.repeat || "none") === r ? " selected" : "") + '>' + REP_FULL[r] + '</option>';
    }).join("");

    return '<div class="task' + (t.done ? " done" : "") + (openId === t.id ? " open" : "") + '" data-id="' + t.id + '">' +
      '<div class="row" data-act="open">' +
        '<button class="check" data-act="toggle" aria-label="完了にする"></button>' +
        '<div class="body">' +
          '<div class="title">' + esc(t.title) + '</div>' +
          (tags.length ? '<div class="meta">' + tags.join("") + '</div>' : "") +
          (t.note ? '<div class="note-preview">' + esc(t.note) + '</div>' : "") +
        '</div>' +
      '</div>' +
      '<div class="editor">' +
        '<div class="fields">' +
          '<div class="full"><label>タイトル</label><input data-f="title" value="' + esc(t.title) + '"></div>' +
          '<div><label>プロジェクト</label><input data-f="project" value="' + esc(t.project) + '" placeholder="経理 / 開発 …"></div>' +
          '<div><label>期限</label><input type="date" data-f="due" value="' + esc(t.due) + '"></div>' +
          '<div><label>優先度</label><select data-f="priority">' + priOpts + '</select></div>' +
          '<div><label>繰り返し</label><select data-f="repeat">' + repOpts + '</select></div>' +
          '<div class="full"><label>メモ</label><textarea data-f="note" placeholder="補足・手順・リンクなど">' + esc(t.note) + '</textarea></div>' +
        '</div>' +
        '<div class="ebar">' +
          '<button class="quick" data-act="due-today">今日</button>' +
          '<button class="quick" data-act="due-tomorrow">明日</button>' +
          '<button class="quick" data-act="due-week">+1週</button>' +
          '<button class="quick" data-act="due-clear">期限なし</button>' +
          '<button class="del" data-act="delete">削除</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function emptyHTML(){
    if(query || projFilter){
      return '<div class="empty"><div class="big">🔍</div><p>条件に合うタスクはありません。</p></div>';
    }
    var m = {
      today: ["☕", "今日やることはありません。", "期限を切ったタスクだけがここに出ます。"],
      week:  ["🗓", "今週が期限のタスクはありません。", ""],
      all:   ["📝", "タスクはまだありません。", "上の入力欄から追加してください。"],
      done:  ["📦", "完了したタスクはまだありません。", ""]
    }[view];
    return '<div class="empty"><div class="big">' + m[0] + '</div><p>' + m[1] + '</p><p>' + m[2] + '</p>' +
      (tasks.length ? "" : '<button id="seedBtn">サンプルを入れて試す</button>') + '</div>';
  }

  function render(){
    renderStats();
    renderProjects();
    var listEl = document.getElementById("list");
    var items = visible().sort(cmp);
    if(!items.length){ listEl.innerHTML = emptyHTML(); return; }
    var groups = {};
    items.forEach(function(t){
      var b = bucket(t);
      (groups[b] = groups[b] || []).push(t);
    });
    var html = "";
    ORDER.forEach(function(g){
      if(!groups[g]) return;
      html += '<div class="group-title' + (g === "期限切れ" ? " overdue" : "") + '">' + g +
              '<span class="cnt">' + groups[g].length + '</span></div>' +
              groups[g].map(taskHTML).join("");
    });
    listEl.innerHTML = html;
  }

  /* ---------- toast ---------- */
  function toast(msg, actLabel, fn){
    var el = document.getElementById("toast"), b = document.getElementById("toastAct");
    document.getElementById("toastMsg").textContent = msg;
    if(actLabel){
      b.style.display = "";
      b.textContent = actLabel;
      b.onclick = function(){ fn(); el.classList.remove("show"); };
    }else{
      b.style.display = "none";
      b.onclick = null;
    }
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 7000);
  }

  /* ---------- events ---------- */
  function syncTabs(){
    var btns = document.querySelectorAll("#tabs button");
    Array.prototype.forEach.call(btns, function(b){
      b.classList.toggle("on", b.getAttribute("data-view") === view);
    });
  }

  document.getElementById("addForm").addEventListener("submit", function(e){
    e.preventDefault();
    var input = document.getElementById("addInput");
    if(!input.value.trim()) return;
    var t = addTask(input.value);
    input.value = "";
    if(t){
      var n = t.due ? diffDays(t.due) : null;
      var hidden = (view === "done") ||
                   (view === "today" && (n === null || n > 0)) ||
                   (view === "week" && (n === null || n > 6)) ||
                   (projFilter && t.project !== projFilter);
      if(hidden){
        view = "all"; projFilter = ""; syncTabs();
        toast("「すべて」に切り替えました");
      }
    }
    render();
  });

  document.getElementById("tabs").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b) return;
    view = b.getAttribute("data-view");
    openId = null;
    syncTabs(); render();
  });

  document.getElementById("projects").addEventListener("click", function(e){
    var b = e.target.closest(".pchip");
    if(!b) return;
    projFilter = b.getAttribute("data-p");
    render();
  });

  document.getElementById("q").addEventListener("input", function(e){
    query = e.target.value;
    render();
  });

  var listEl = document.getElementById("list");
  listEl.addEventListener("click", function(e){
    if(e.target.id === "seedBtn"){ seed(); return; }
    var card = e.target.closest(".task");
    if(!card) return;
    var actEl = e.target.closest("[data-act]");
    if(!actEl) return;
    var id = card.getAttribute("data-id");
    var act = actEl.getAttribute("data-act");
    var t = find(id);
    if(act === "toggle"){ e.stopPropagation(); toggle(id); return; }
    if(act === "delete"){ remove(id); return; }
    if(act === "open"){ openId = (openId === id ? null : id); render(); return; }
    if(act.indexOf("due-") === 0 && t){
      t.due = act === "due-today" ? iso(today())
            : act === "due-tomorrow" ? iso(addDays(today(), 1))
            : act === "due-week" ? iso(addDays(today(), 7)) : "";
      save(); render();
    }
  });

  listEl.addEventListener("input", function(e){
    var f = e.target.getAttribute("data-f");
    if(!f) return;
    var card = e.target.closest(".task");
    var t = find(card.getAttribute("data-id"));
    if(!t) return;
    t[f] = e.target.value;
    save();
    renderStats();
  });

  listEl.addEventListener("change", function(e){
    var f = e.target.getAttribute("data-f");
    if(f === "due" || f === "priority" || f === "repeat" || f === "project"){
      var card = e.target.closest(".task");
      var t = find(card.getAttribute("data-id"));
      if(!t) return;
      t[f] = e.target.value;
      save(); render();
    }
  });

  listEl.addEventListener("keydown", function(e){
    if(e.key === "Enter" && e.target.getAttribute("data-f") === "title"){
      e.preventDefault(); openId = null; render();
    }
    if(e.key === "Escape"){ openId = null; render(); }
  });

  document.addEventListener("keydown", function(e){
    var tag = (e.target.tagName || "").toLowerCase();
    if(tag === "input" || tag === "textarea" || tag === "select") return;
    if(e.key === "n"){ e.preventDefault(); document.getElementById("addInput").focus(); }
    if(e.key === "/"){ e.preventDefault(); document.getElementById("q").focus(); }
  });

  /* ---------- theme ---------- */
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    try{ localStorage.setItem(TKEY, t); }catch(e){}
  }
  var savedTheme = null;
  try{ savedTheme = localStorage.getItem(TKEY); }catch(e){}
  applyTheme(savedTheme || ((window.matchMedia && matchMedia("(prefers-color-scheme:dark)").matches) ? "dark" : "light"));
  document.getElementById("themeBtn").addEventListener("click", function(){
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  /* ---------- import / export ---------- */
  document.getElementById("expBtn").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(tasks, null, 2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "mytasks-" + iso(today()) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });

  document.getElementById("impBtn").addEventListener("click", function(){
    document.getElementById("impFile").click();
  });

  document.getElementById("impFile").addEventListener("change", function(e){
    var f = e.target.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var d = JSON.parse(r.result);
        if(!Array.isArray(d)) throw new Error("not an array");
        var have = {};
        tasks.forEach(function(t){ have[t.id] = 1; });
        var n = 0;
        d.forEach(function(t){
          if(t && t.id && t.title && !have[t.id]){ tasks.push(t); n++; }
        });
        save(); render();
        toast(n + "件を読み込みました");
      }catch(err){ toast("JSONの形式が違います"); }
    };
    r.readAsText(f);
    e.target.value = "";
  });

  document.getElementById("mdBtn").addEventListener("click", function(){
    var lines = visible().sort(cmp).map(function(t){
      return "- [" + (t.done ? "x" : " ") + "] " + t.title +
             (t.project ? " `#" + t.project + "`" : "") +
             (t.due ? " (" + t.due + ")" : "");
    });
    var text = lines.join("\n") || "（なし）";
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(
        function(){ toast("Markdownをコピーしました"); },
        function(){ fallbackCopy(text); }
      );
    }else{
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); toast("Markdownをコピーしました"); }
    catch(e){ toast("コピーできませんでした"); }
    document.body.removeChild(ta);
  }

  document.getElementById("clearDone").addEventListener("click", function(){
    var cutoff = iso(addDays(today(), -30));
    var before = tasks.length;
    tasks = tasks.filter(function(t){
      return !(t.done && (t.doneAt || "").slice(0,10) < cutoff);
    });
    save(); render();
    var n = before - tasks.length;
    toast(n ? n + "件の古い完了タスクを削除しました" : "30日以上前の完了タスクはありません");
  });

  /* ---------- seed ---------- */
  function seed(){
    ["今日の優先3件を決める #ルーティン @今日 *毎日",
     "リリースノートを書く #開発 @今日 !",
     "申請書の様式をチェック #事務 @明日 !!",
     "請求書を送付 #経理 @+3",
     "週次SNS投稿の下書き #広報 @金 *毎週",
     "読みかけの技術記事を消化 #インプット"].forEach(function(s){ addTask(s); });
    render();
  }

  /* ---------- boot ---------- */
  var d = new Date();
  document.getElementById("todayLabel").textContent =
    d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日 (" + WD[d.getDay()] + ")";
  render();
})();
</script>
</body>
</html>
